<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M7 39 V9 L24 28 L41 9 V39' fill='none' stroke='%23b3541e' stroke-width='6.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<title>Milan — Training</title>
<style>
  :root{
    --bg:#f2f1ec; --surface:#ffffff; --surface2:#faf9f6; --ink:#1c2430; --ink2:#4a5568; --ink3:#7a8699;
    --line:#e3e0d8; --line2:#edf0f3;
    --brand:#b3541e;
    --done:#1e8e4f; --done-bg:#e6f4ec;
    --part:#b97e0a; --part-bg:#fdf3dc;
    --miss:#c53030; --miss-bg:#fdecec;
    --togo:#2563eb; --togo-bg:#e8effe;
    --block:#822727; --block-bg:#f6e3e3;
    --later:#5b6b82; --later-bg:#e9edf2;
    --shadow:0 1px 3px rgba(28,36,48,.07);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171c; --surface:#1e232b; --surface2:#232932; --ink:#eef1f5; --ink2:#b6bfcc; --ink3:#8a95a6;
      --line:#333b47; --line2:#2b323d;
      --brand:#e08a4c;
      --done:#3ecf7f; --done-bg:#173527;
      --part:#f0b93e; --part-bg:#3a2f14;
      --miss:#f07373; --miss-bg:#3d1f1f;
      --togo:#7aa5ff; --togo-bg:#1d2c4d;
      --block:#e08a8a; --block-bg:#3a2323;
      --later:#9fb0c6; --later-bg:#2a3342;
      --shadow:0 1px 3px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.45}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 56px}
  .brandhead{display:flex;align-items:center;gap:10px;margin:0 0 10px;color:var(--brand)}
  .brandhead svg{width:34px;height:34px;flex:0 0 auto;display:block}
  .brandhead .wm{font-size:1.4rem;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
  .kicker{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
  h1{font-size:clamp(1.7rem,4.5vw,2.5rem);line-height:1.1;margin:.25rem 0 .35rem;font-weight:800;letter-spacing:-.01em}
  h1 .brand{color:var(--brand)}
  .updated{font-size:.9rem;color:var(--ink2)}
  .updated b{color:var(--ink)}
  .nav{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
  .nav a{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:.35rem .85rem;font-size:.82rem;text-decoration:none;min-height:2.25rem;display:inline-flex;align-items:center}
  .nav a.on{border-color:var(--brand);color:var(--brand);font-weight:700}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0 8px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
  .stat .n{font-size:1.45rem;font-weight:800;line-height:1.05;color:var(--brand)}
  .stat .l{font-size:.78rem;color:var(--ink2);margin-top:3px}
  section{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 0 14px;box-shadow:var(--shadow);overflow:hidden}
  section h2{font-size:1.02rem;margin:0;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  section h2 .sc{font-size:.8rem;color:var(--ink3);font-weight:600;white-space:nowrap}
  .pad{padding:12px 16px}
  .bullets{font-size:.92rem;color:var(--ink2);margin:0;padding-left:18px}
  .bullets li{margin:0 0 6px}
  .bullets li:last-child{margin-bottom:0}
  .irow{display:flex;gap:10px;align-items:flex-start;padding:9px 16px;border-bottom:1px solid var(--line2)}
  .irow:last-child{border-bottom:none}
  .chip{flex:0 0 auto;font-size:.66rem;font-weight:800;letter-spacing:.06em;padding:.18rem .5rem;border-radius:999px;margin-top:.15rem;min-width:4.4rem;text-align:center}
  .chip.done{background:var(--done-bg);color:var(--done)}
  .chip.part{background:var(--part-bg);color:var(--part)}
  .chip.togo{background:var(--togo-bg);color:var(--togo)}
  .chip.block{background:var(--block-bg);color:var(--block)}
  .txt{flex:1 1 auto;min-width:0}
  .note{display:block;font-size:.85rem;color:var(--ink2);margin-top:1px}
  .logo{flex:0 0 auto;width:32px;height:32px;border-radius:9px;background:#232932;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .logo img{width:19px;height:19px;display:block}
  .logo img.full{width:100%;height:100%}
  .urow{display:flex;gap:10px;align-items:center}
  .tblwrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:820px}
  th{text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
  td{padding:9px 14px;border-bottom:1px solid var(--line2);vertical-align:top}
  tr:last-child td{border-bottom:none}
  td.mname{font-weight:700;white-space:nowrap}
  .mcell{display:flex;gap:9px;align-items:center}
  .err{background:var(--miss-bg);color:var(--miss);border-radius:10px;padding:12px 14px;font-size:.9rem}
  footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:.85rem;color:var(--ink2)}
  footer a{color:var(--brand)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandhead">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M7 39 V9 L24 28 L41 9 V39" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="wm">Milan</span>
  </div>
  <div class="kicker">Milan · Self-Training</div>
  <h1>How Milan <span class="brand">Trains</span></h1>
  <div class="updated" id="updated">Loading the latest training records…</div>
  <nav class="nav">
    <a href="tracker.html">Progress tracker</a>
    <a href="usage.html">Usage</a>
    <a href="training.html" class="on">Training</a>
    <a href="privacy.html">Privacy</a>
  </nav>
  <div class="stats" id="stats"></div>
  <div id="how"></div>
  <div id="bank"></div>
  <div id="inuse"></div>
  <div id="models"></div>
  <div id="rules"></div>
  <div id="notes"></div>
  <div id="err"></div>
  <footer>
    Operated by Buzz Compare LLC · Contact: <a href="mailto:support@milan.bot">support@milan.bot</a>
  </footer>
</div>
<script>
var DATA = null;
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function logo(icon, full){
  return '<span class="logo"><img src="'+esc(icon)+'" alt="" loading="lazy"'+(full ? ' class="full"' : '')+'></span>';
}
function bulletSection(id, title, sc, items){
  document.getElementById(id).innerHTML =
    '<section><h2><span>'+esc(title)+'</span>'+(sc ? '<span class="sc">'+esc(sc)+'</span>' : '')+'</h2>' +
    '<div class="pad"><ul class="bullets">' + items.map(function(i){ return '<li>'+esc(i)+'</li>'; }).join("") + '</ul></div></section>';
}
function render(){
  document.getElementById("updated").innerHTML =
    'Records as of: <b>' + esc(DATA.generated_at_label || DATA.generated_at) + '</b> · ' + esc(DATA.asof_note || '');
  document.getElementById("stats").innerHTML = DATA.stats.map(function(m){
    return '<div class="stat"><div class="n">'+esc(m.value)+'</div><div class="l">'+esc(m.label)+'</div></div>';
  }).join("");
  bulletSection("how", "How the training works", "", DATA.how_it_works);
  var b = '<section><h2><span>The 100-task test bank</span><span class="sc">launch-gate set</span></h2>';
  DATA.test_bank.rows.forEach(function(r){
    b += '<div class="irow"><span class="chip done">'+esc(r.range.replace("Tasks ",""))+'</span>' +
      '<div class="txt"><b>'+esc(r.author)+'</b> — '+esc(r.range)+'<span class="note">'+esc(r.note)+'</span></div></div>';
  });
  b += '<div class="pad"><ul class="bullets"><li>'+esc(DATA.test_bank.held_out)+'</li>' +
    '<li>Launch gate: ' + DATA.test_bank.gates.map(esc).join(" · ") + '.</li></ul></div></section>';
  document.getElementById("bank").innerHTML = b;
  var u = '<section><h2><span>Currently trained &amp; in use</span><span class="sc">live assignments</span></h2>';
  DATA.in_use.forEach(function(m){
    u += '<div class="irow"><div class="txt"><span class="urow">'+logo(m.icon, m.icon_full)+'<span><b>'+esc(m.model)+'</b> — '+esc(m.assignment)+'</span></span>' +
      '<span class="note">'+esc(m.note)+'</span></div><span class="chip done">IN USE</span></div>';
  });
  u += '<div class="pad"><ul class="bullets"><li>'+esc(DATA.in_use_note)+'</li></ul></div></section>';
  document.getElementById("inuse").innerHTML = u;
  var t = '<section><h2><span>Per-model training</span><span class="sc">rounds in progress</span></h2><div class="tblwrap"><table>' +
    '<tr><th>Model</th><th>Job kinds tested</th><th>Tests run</th><th>Best results</th><th>Status</th></tr>';
  DATA.models.forEach(function(m){
    t += '<tr><td class="mname"><span class="mcell">'+logo(m.icon, m.icon_full)+esc(m.model)+'</span></td>' +
      '<td>'+esc(m.kinds)+'</td><td>'+esc(m.tests)+'</td><td>'+esc(m.best)+'</td>' +
      '<td><span class="chip '+m.status_class+'">'+esc(m.status.toUpperCase())+'</span></td></tr>';
  });
  t += '</table></div></section>';
  document.getElementById("models").innerHTML = t;
  bulletSection("rules", "Graduation &amp; probation rules".replace("&amp;","&"), "", DATA.rules);
  bulletSection("notes", "Notes", "", DATA.notes);
}
fetch("training-data.json", {cache:"no-store"})
  .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(function(d){ DATA = d; render(); })
  .catch(function(e){
    document.getElementById("updated").textContent = "";
    document.getElementById("err").innerHTML = '<div class="err">Could not load the training data ('+esc(e.message)+'). Please reload.</div>';
  });
</script>
</body>
</html>
